<style>

<body>
<div id="stage"><canvas id="c" width="900" height="500"></canvas><div id="ui"></div><button id="pauseBtn" aria-label="Pause game">Pause (P)</button></div>
<div id="hint"><kbd>A</kbd><kbd>D</kbd> or <kbd>&larr;</kbd><kbd>&rarr;</kbd> move &nbsp; <kbd>W</kbd>/<kbd>&uarr;</kbd>/<kbd>Space</kbd> jump &nbsp; <kbd>F</kbd> set &nbsp; <kbd>G</kbd> bump (spike while jumping) &nbsp; <kbd>H</kbd> ghost reserve (Cyrus) &nbsp; <kbd>P</kbd> pause</div>

const cv=document.getElementById('c'),ui=document.getElementById('ui');let g=cv.getContext('2d'),tick=0,shopTab='cookies';
const hintEl=document.getElementById('hint'),H1=hintEl.innerHTML,H2='<b>P1</b> <kbd>A</kbd><kbd>D</kbd> move <kbd>W</kbd> jump <kbd>F</kbd> set <kbd>G</kbd> bump/spike &nbsp; <b>P2</b> <kbd>&larr;</kbd><kbd>&rarr;</kbd> move <kbd>&uarr;</kbd> jump <kbd>N</kbd> set <kbd>M</kbd> bump/spike &nbsp; <kbd>H</kbd> ghost reserve (Cyrus) &nbsp; <kbd>P</kbd> pause';
const hintFor=h=>{const nm={cyrus:'ghost reserve (Cyrus)',astra:'blinding stars (Astra)',cinder:'call of the dead (Cinder)'},id=CK().id;let r=(onlineOn||!nm[id])?h.replace(/\s*&nbsp;\s*<kbd>H<\/kbd> ghost reserve \(Cyrus\)/,''):h.replace('ghost reserve (Cyrus)',nm[id]);const i2=CK2().id;if(players===2&&['astra','cinder','cyrus','clovis'].includes(i2))r+=' &nbsp; <kbd>.</kbd> '+(nm[i2]||'shadow ability (Clovis)')+' (P2)';if(id==='marcus')r+=' &nbsp; <kbd>H</kbd> Time Jump/stomp &nbsp; <kbd>F</kbd> roar &nbsp; <kbd>G</kbd> headbutt';return r};

 if(paused){ui.innerHTML=SCR.pause();ui.style.background='rgba(20,5,40,.4)';ui.style.display='flex';const f=ui.querySelector('button');if(f)f.focus({preventScroll:true})}

 {id:'butter',n:'Leo',r:'common',p:0,bm:1,sm:1,d2:'The classic. No passive.'},

 {id:'cheese',n:'Blake',r:'uncommon',p:1250,bm:1.2,sm:1,ns:1,d2:'Bumps are 20% stronger, but you cannot set.'},
 {id:'milo',n:'Milo',r:'uncommon',p:1250,bm:1,sm:1,serves:1,d2:"A serving specialist with a trick for every serve. Serve with set: overhand float serve (it wobbles in the air). Serve with bump: underhand serve (high and short). Serve with a jump spike: topspin serve (fast and it dips)."},
 {id:'wyla',n:'Wyla',r:'rare',p:1375,bm:1,sm:1,sp:1.25,nb:1,dsp:1,d2:'You cannot bump, but spikes are 25% stronger and fly deep into their side.'},
 {id:'vanilla',n:'Hazel',r:'rare',p:1500,bm:1.15,sm:1.15,sp:1.15,d2:'Sets, bumps and spikes are 15% stronger.'},
 {id:'joel',n:'Fisherman Joel',r:'epic',p:1750,bm:1.55,sm:1.55,sp:1.55,dsp:1,sr:1.25,hut:1,vis:1,d2:"Everything he does is 55% stronger. Fish Bump: he pulls out a fish and sends the ball deep. Crab Hut Set: a high set that drops by the net for a spike, or goes over if he is at the net. Octo's Spike: he pulls out an octopus for a very powerful spike that flies deep, with a bigger hitbox."},
 {id:'reyna',n:'Reyna',r:'epic',p:1750,bm:1,sm:1,sp:1.7,nb:1,dj:1,d2:'Can double jump. Spikes are 70% stronger and always stay on screen, but she cannot bump.'},
 {id:'cyrus',n:'Ghost Charmer Cyrus',r:'legendary',p:2500,bm:1,sm:1,sp:1,d2:'Starts every match with one ghost (ghosts never carry over). Every fifth successful hit summons another, up to 5 ghosts; each ghost boosts spike power by 10%. A ghost automatically sacrifices itself to save a ball about to land on your side. Press H to sacrifice a ghost and serve by dropping the ball.'},
 {id:'clovis',n:'Cloak Master Clovis',r:'legendary',p:2500,bm:1.2,sm:1.2,sp:1.2,d2:'All his moves are 20% stronger. His shadow clone copies his every move and dashes to catch any ball about to fall.'},
 {id:'astra',n:'Star Struck Astra',r:'mythic',p:5000,bm:1.65,sm:1,sp:1.65,jh:1.2,dj:2,d2:'Hits like a truck: spikes and bumps 65% stronger, jumps higher, and can double jump. H: Blinding Stars turns the sky to night and the enemy gapes at two bright stars, frozen, while she keeps hitting.'},
 {id:'cinder',n:'Soul Catcher Cinder',r:'mythic',p:5000,bm:1.7,sm:1,sp:1.7,rch:1.35,d2:'Giant scythe: stronger swings and a bigger hitbox, spikes and bumps 70% stronger. Every 7 hits a skeleton teammate joins (max 1). H: Call of the Dead.'},
 {id:'poseidon',n:'Poseidon',r:'mythic',p:0,secret:1,bm:1,sm:1,nb:1,nsp:1,shk:1,d2:"ULTRA SECRET ADMIN. Cannot bump or spike. Pressing set summons a giant shark that eats the enemy and wins the match instantly, even at 0 points."}];
const RAR={common:['Common','#6b6b80'],uncommon:['Uncommon','#2e8f55'],rare:['Rare','#2f6fd8'],epic:['Epic','#8a3fd0'],legendary:['Legendary','#b86e00'],mythic:['Mythic','#d6204f'],divine:['Divine','#16151f']};
const rarTag=r=>'<span class="rar" style="background:'+RAR[r][1]+'">'+RAR[r][0]+'</span>';
const BALLS=[
 {id:'pepper',n:'Classic',a:'#fffaf0',b:'#3b6fd8',p:0,r:'common',ab:'',d2:'The original. No special ability.'},
 {id:'lemon',n:'Beach',a:'#ffd166',b:'#ef476f',p:0,r:'common',ab:'feather',d2:'Featherlight: the ball falls 12% slower.'},
 {id:'grape',n:'Midnight',a:'#2a2458',b:'#ffd27a',p:0,r:'common',ab:'coin',d2:'Coin Magnet: +2 coins every point you score.'},
 {id:'mint',n:'Mint Fizz',a:'#b8f2d8',b:'#2fbf8f',p:0,r:'common',ab:'mint',d2:'Soft Touch: your bumps fly 10% higher.'},
 {id:'sun',n:'Sunburst',a:'#ffcf4a',b:'#ff7a1a',p:0,r:'uncommon',ab:'hot',d2:'Hot Hands: your spikes are 12% faster.'},
 {id:'gum',n:'Bubblegum',a:'#ffc2e2',b:'#ff5fa8',p:0,r:'uncommon',ab:'sticky',d2:'Sticky: your spikes slow the enemy for 1 second.'},
 {id:'frost',n:'Frostbite',a:'#d8f4ff',b:'#3fa9ff',p:0,r:'rare',ab:'frost',d2:'Frostbite: your spikes slow the enemy for 2 seconds.'},
 {id:'magnet',n:'Magnet',a:'#ff6b6b',b:'#4b5bd6',p:0,r:'rare',ab:'magnet',d2:'Magnet: the ball drifts toward you on your side.'},
 {id:'phoenix',n:'Phoenix',a:'#ffd166',b:'#e8452c',p:0,r:'epic',ab:'phoenix',d2:'Second Wind: once per match, a ball about to hit your sand bounces back up.'},
 {id:'thunder',n:'Thunder',a:'#3b2a7a',b:'#ffe14a',p:0,r:'epic',ab:'thunder',d2:'Thunder: your spikes stun the enemy for 1 second.'},
 {id:'midas',n:'Midas',a:'#ffe27a',b:'#c98a00',p:0,r:'legendary',ab:'midas',d2:'Golden Touch: every point you score pays triple coins.'},
 {id:'void',n:'Singularity',a:'#0b0620',b:'#b46bff',p:0,r:'mythic',ab:'void',d2:'Singularity: all your hits are 20% stronger, your spikes nearly freeze the enemy for 2 seconds, and +5 coins every point.'},
 {id:'comet',n:'Comet',a:'#9fe8ff',b:'#7a4bff',p:0,r:'legendary',ab:'comet',d2:'Comet: all your hits are 15% stronger.'}];
const DIFF={
 easy:{n:'Easy',sp:1.9,err:140,set:.95,lag:45,miss:.38,aim:0,mult:1,spk:0,spd:0},
 medium:{n:'Medium',sp:2.6,err:90,set:.8,lag:28,miss:.26,aim:0,mult:1.25,spk:.4,spd:8.5},
 hard:{n:'Hard',sp:3.4,err:55,set:.55,lag:16,miss:.16,aim:1,mult:1.5,spk:.65,spd:10},
 impossible:{n:'IMPOSSIBLE',sp:7,err:6,set:0,lag:3,miss:.02,aim:2,mult:3,spk:.95,spd:15},
 e404:{n:'ERROR 404',sp:13.5,err:0,set:0,lag:0,miss:0,aim:3,mult:10,spk:1,spd:21,reach:112}};

/* ---------- saving: several storage layers + a manual save code ---------- */
const KEY='bv4',DEF=()=>({coins:0,own:['butter','pepper'],skin:'butter',ball:'pepper',t:0,b:{},stats:{},q:null});
const validSave=s=>{if(!(s&&typeof s==='object'&&typeof s.coins==='number'&&Array.isArray(s.own)))return false;
 if(s.own.includes('magnus'))s.coins+=1000;s.own=s.own.filter(id=>SKINS.some(x=>x.id===id)||BALLS.some(x=>x.id===id));
 for(const d of['butter','pepper'])if(!s.own.includes(d))s.own.push(d);
 if(!SKINS.some(x=>x.id===s.skin)||!s.own.includes(s.skin))s.skin='butter';
 if(!BALLS.some(x=>x.id===s.ball)||!s.own.includes(s.ball))s.ball='pepper';return true};
let migrated=false;
const parseSave=str=>{try{const s=JSON.parse(str);
 if(s&&typeof s==='object'&&Array.isArray(s.own)){if(s.own.indexOf('cacao')>=0){s.own=s.own.filter(x=>x!=='cacao');s.coins=(+s.coins||0)+350;migrated=true}if(s.skin==='cacao'){s.skin='butter';migrated=true}if(s.skin==='orion'){s.skin='butter';migrated=true}if(s.own.includes('orion')){s.own=s.own.filter(x=>x!=='orion');migrated=true}}
 return validSave(s)?s:null}catch(e){return null}};
const ST={
 ls:{g:()=>{try{return localStorage.getItem(KEY)}catch(e){return null}},s:v=>{try{localStorage.setItem(KEY,v);return true}catch(e){return false}}},
 ss:{g:()=>{try{return sessionStorage.getItem(KEY)}catch(e){return null}},s:v=>{try{sessionStorage.setItem(KEY,v);return true}catch(e){return false}}},
 ck:{g:()=>{try{const m=document.cookie.match(/(?:^|; )bv4=([^;]*)/);return m?decodeURIComponent(m[1]):null}catch(e){return null}},s:v=>{try{document.cookie='bv4='+encodeURIComponent(v)+';max-age=31536000;path=/;SameSite=Lax';return true}catch(e){return false}}},
 nm:{g:()=>{try{return window.name.indexOf('BV4:')===0?window.name.slice(4):null}catch(e){return null}},s:v=>{try{if(!window.name||window.name.indexOf('BV4:')===0)window.name='BV4:'+v;return true}catch(e){return false}}}};
function idbOpen(cb){try{const r=indexedDB.open('bvdb',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>cb(r.result);r.onerror=()=>cb(null)}catch(e){cb(null)}}
function idbSet(v){idbOpen(db=>{if(!db)return;try{db.transaction('s','readwrite').objectStore('s').put(v,KEY)}catch(e){}})}
function idbGet(cb){idbOpen(db=>{if(!db)return cb(null);try{const q=db.transaction('s').objectStore('s').get(KEY);q.onsuccess=()=>cb(q.result||null);q.onerror=()=>cb(null)}catch(e){cb(null)}})}
const storageOK=(function(){let a=false,b=false;try{localStorage.setItem('bvt','1');a=localStorage.getItem('bvt')==='1';localStorage.removeItem('bvt')}catch(e){}try{document.cookie='bvt=1;path=/;max-age=60';b=document.cookie.indexOf('bvt=1')>=0}catch(e){}return a||b})();
let curScr='title';
let save=(function(){try{for(const o of['bv1','bv2','bv3'])localStorage.removeItem(o)}catch(e){}
 let best=null;for(const k in ST){const s=parseSave(ST[k].g());if(s&&(!best||(s.t||0)>(best.t||0)))best=s}return best||DEF()})();
const CK=()=>is404()&&phase>=3&&suddenDeath?SKINS.find(s=>s.id==='butter'): (SKINS.find(s=>s.id===save.skin)||SKINS[0]);
const gameName=k=>k?String(k.n).split(' ').pop():'';

if(migrated)writeAll();

/* ---------- badges, daily quests and stats ---------- */
const BADGES=[
 {id:'first',n:'First Win',d:'Win a match',r:50},

const QPOOL=[
 {id:'play2',txt:'Play 2 matches',ev:'play',goal:2,r:100,tier:0},

const dayKey=()=>{const d=new Date(Date.now()-8*3600000);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function msToReset(){const n=new Date(),r=new Date(n.getFullYear(),n.getMonth(),n.getDate(),8,0,0);if(n>=r)r.setDate(r.getDate()+1);return r-n}
const leftTxt=()=>{const m=Math.max(1,Math.round(msToReset()/60000));return Math.floor(m/60)+'h '+(m%60)+'m'};
function ensureQuests(){const key=dayKey();if(save.q&&save.q.day===key&&Array.isArray(save.q.list)&&save.q.list.length===3)return false;
 let sd=0;for(let i=0;i<key.length;i++)sd=(sd*31+key.charCodeAt(i))%100003;
 const rq=i=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};
 save.q={day:key,list:[0,1,2].map(t=>{const pool=QPOOL.filter(x=>x.tier===t);return{id:pool[Math.floor(rq(sd+t*31)*pool.length)].id,prog:0,claimed:false}})};return true}
function ensureSave(){if(!save.b||typeof save.b!=='object')save.b={};if(!save.stats||typeof save.stats!=='object')save.stats={};

 for(const q of save.q.list){const d=QPOOL.find(x=>x.id===q.id);if(d&&d.ev===ev&&!q.claimed&&q.prog<d.goal){q.prog=Math.min(d.goal,q.prog+n);if(q.prog>=d.goal)note('Quest complete: '+d.txt+'. Claim it in Daily quests.')}}}

const h53=(s,seed)=>{seed=seed||0;let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};

 g.save();g.translate(B.x,B.y);g.rotate(B.rot);g.fillStyle=bk.a;g.beginPath();g.arc(0,0,BR,0,7);g.fill();
 g.strokeStyle=bk.b;g.lineWidth=3;g.lineCap='round';for(let i=0;i<3;i++){g.rotate(2.0944);g.beginPath();g.arc(-BR,0,BR*.95,-.9,.9);g.stroke()}
 g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=1.6;g.beginPath();g.arc(0,0,BR-.8,0,7);g.stroke();g.restore()
 g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.ellipse(B.x-5,B.y-6,4,2.4,-.6,0,7);g.fill()}
function txt(t,x,y,size,col,al){const ff=z=>{g.font=z+'px "Bowlby One",Impact,sans-serif'};ff(size);const tw=g.measureText(t).width;if(tw>W-60){size=Math.floor(size*(W-60)/tw);ff(size)}g.textAlign=al||'center';g.lineWidth=5;g.strokeStyle='rgba(110,50,170,.9)';g.strokeText(t,x,y);g.fillStyle=col||'#fff4e0';g.fillText(t,x,y)}
function pill(x,y,w,h){g.fillStyle='rgba(255,255,255,.88)';g.beginPath();g.roundRect(x,y,w,h,h/2);g.fill()}
function ptxt(t,x,y,size,col,al,mw){g.font=size+'px "Bowlby One",Impact,sans-serif';g.textAlign=al;g.fillStyle=col;g.fillText(t,x,y,mw||400)}
function glitch(){g.fillStyle='rgba(70,0,25,.22)';g.fillRect(0,0,W,H);
 if(tick%53<5){for(let i=0;i<4;i++){const gy=rnd(tick*3+i)*H;g.fillStyle=i%2?'rgba(0,255,240,.22)':'rgba(255,40,90,.25)';g.fillRect(0,gy,W,3+rnd(tick+i)*10)}}}
function draw(){
 g.save();
 if(mode==='game'&&shark){const k=shark,e=k.done?Math.max(0,k.fade/24):1,z=1+e*(.06*Math.min(1,k.t/50)+(k.bite>0?.05*k.bite/26:0)),amp=k.bite>0?k.bite*.35:0;g.translate(W/2+(rnd(tick*7)-.5)*amp*2,H/2+(rnd(tick*7+3)-.5)*amp*2);g.scale(z,z);g.translate(-W/2,-H/2)}
 g.drawImage(bg,0,0);
 if(starT>0&&mode==='game')drawNight();
 if(is404()&&mode==='game'&&cloneOn){g.save();g.globalAlpha=.5;g.translate(Math.sin(tick/2)*4,0);drawPlayer(A3,-1,JADEN,false,true);g.restore()}
 if(is404()&&mode==='game'&&A.fly){g.save();g.globalAlpha=.3;g.fillStyle='#ff2d2d';g.beginPath();g.ellipse(A.x,A.y-45,46,72,0,0,7);g.fill();g.restore()}
 if(is404()&&mode==='game'&&!A2.eaten)drawPlayer(A2,-1,JADEN,false,true);
 if(!A.eaten)drawRider(A,-1,onlineOn?skinById(netSkin[1]):(players===2?CK2():OPP()),mode==='game'&&players===1&&(cur==='impossible'||cur==='e404'));
 if(!P.eaten)drawRider(P,1,onlineOn?skinById(netSkin[0]):CK(),false);
 if(mode==='game'){
  if(CK().id==='clovis'&&!P.eaten){g.save();g.globalAlpha=.55;drawPlayer(C,1,CK(),false);g.restore()}
  if(players===2&&CK2().id==='clovis'&&!A.eaten){g.save();g.globalAlpha=.55;drawPlayer(A2,-1,CK2(),false);g.restore()}
  if(slowA>0){g.save();g.strokeStyle='#7fd8ff';g.lineWidth=3;g.beginPath();g.ellipse(A.x,A.y,30,8,0,0,7);g.stroke();g.restore()}
  drawSkels();drawFelixShark();if(starT>0)drawStruck();if(deadT>0)drawArms();spPill('p');spPill('a');
  if(!onlineOn&&CK().id==='marcus')crabPill(marcusForm>0?'T-REX MODE '+Math.ceil(marcusForm/60)+'s':marcusCD>0?'TIME JUMP '+Math.ceil(marcusCD/60)+'s':'TIME JUMP [H] READY',false);
  ghosts.forEach((gh,i)=>{const side=gh.side||'p',owner=side==='p'?P:A;gh.phase+=.04;gh.x+=(owner.x+(side==='p'?55+i*12:-55-i*12)-gh.x)*.025;gh.y=owner.y-145+Math.sin(tick/12+gh.phase)*18;drawGhost(gh.x,gh.y)})
  if(sacAnim){const a=Math.max(0,1-sacAnim.frame/30);g.save();g.globalAlpha=a;g.shadowColor='#a9eaff';g.shadowBlur=22;drawGhost(sacAnim.x,sacAnim.y);g.strokeStyle='rgba(210,250,255,'+a+')';g.lineWidth=3;g.beginPath();g.moveTo(sacAnim.x,sacAnim.y);g.lineTo(sacAnim.tx,sacAnim.ty);g.stroke();g.restore();if(sacAnim.frame<24){g.save();g.globalAlpha=a;g.fillStyle='#d8f5ff';for(let i=0;i<7;i++){const ang=i*6.283/7+sacAnim.frame*.18,rad=sacAnim.frame*1.1;g.beginPath();g.arc(sacAnim.tx+Math.cos(ang)*rad,sacAnim.ty+Math.sin(ang)*rad,2.5,0,7);g.fill()}g.restore()}}
  drawBall();if(shark&&!shark.done)drawShark();if(is404())glitch();
 }
 g.restore();
 if(mode==='game'){
  if(shark)cinema();pill(16,14,170,48);ptxt(onlineOn?netNames[0]:gameName(CK()),34,47,20,'#5b2a86','left',100);ptxt(ps,170,48,28,'#ff7a45','right');
  pill(W-186,14,170,48);ptxt(onlineOn?netNames[1]:(players===2?gameName(CK2()):oppName()),W-168,47,20,'#5b2a86','left',100);ptxt(as,W-32,48,28,'#ff7a45','right');
  if(players===1){pill(W/2-105,14,210,36);ptxt(cfg.n,W/2-92,39,16,cfg.aim===2?'#e0245e':'#5b2a86','left');ptxt('x'+cfg.mult+' coins',W/2+95,39,14,'#d4532a','right')}else{pill(W/2-80,14,160,36);ptxt(onlineOn?'Online match':'Two players',W/2,39,16,'#5b2a86','center')}
  if(is404()&&phase>=3&&!cut){pill(W/2-250,62,500,30);ptxt('ALL ABILITIES ARE USELESS AGAINST THEM',W/2,83,16,'#b3174a','center',480)}
  if(msgT>0&&msg)txt(msg,W/2,150,40);if(cut)drawCut();
 }
}

/* ---------- input + loop ---------- */
function swing(c,ty,ck,superSpike=false){const sd=c===P?'p':'a';if(root[sd]>0||frz[sd]>0)return;if(c.sw)return;if(c===P&&ck.id==='marcus'&&marcusForm>0&&ty==='bump'){say2('THE T-REX CANNOT BUMP! PRESS G TO HEADBUTT.',55);return}
 if(ty==='spike'&&ck.nsp){say2(gameName(ck)+" can't spike!",50);return}
 if(ty==='spike'&&c.y>=GR-16){say2('Jump to spike!',35);return}
 if(ty==='bump'&&ck.nb){say2(gameName(ck)+" can't bump!",50);return}
 if(ty==='set'&&ck.ns){say2(gameName(ck)+" can't set!",50);return}
 if(ty==='set'&&ck.shk){if(st==='play'||st==='serve'){startShark(c);c.sw={type:'set',t:18,done:true}}return}
 c.sw={type:ty,t:18,done:false,super:superSpike,sharkWhip:ck.id==='sharkfelix'&&ty==='spike'}}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(invertT>0){if(k==='a')k='d';else if(k==='d')k='a';else if(k==='arrowleft')k='arrowright';else if(k==='arrowright')k='arrowleft';}
 if(['arrowleft','arrowright','arrowup','arrowdown',' ',','].includes(k)&&mode==='game')e.preventDefault();
 keys[k]=true;
 if(mode!=='game')return;
 if(onlineOn){if(e.repeat)return;if(onl.role==='join'){netKey(e.code)}else if(e.code==='KeyH'){if(CK().id==='cyrus')startGhostSacrifice();else if(CK().id==='astra'||CK().id==='cinder')special('p')}else if(e.code==='KeyG')swing(P,P.y<GR-16?'spike':'bump',CK());else if(e.code==='KeyF')swing(P,'set',CK());return}
 if(k==='escape'||k==='p'){if(!e.repeat)togglePause();return}
 if(paused||e.repeat)return;
 if(k==='h'&&CK().id==='cyrus'&&ghosts.length>0){startGhostSacrifice();return}
 if(k==='h'&&CK().id==='marcus'){marcusActivate();return}
 if(k==='h'&&!onlineOn&&(CK().id==='astra'||CK().id==='cinder')){special('p');return}
 if(k==='.'&&players===2&&['astra','cinder'].includes(CK2().id)){special('a');return}
 if(k==='.'&&players===2&&CK2().id==='cyrus'){startGhostSacrificeFor('a');return}
 if(e.code==='KeyG'){if(CK().id==='marcus'&&marcusForm>0)marcusHeadbutt();else swing(P,P.y<GR-16?'spike':'bump',CK())}else if(e.code==='KeyF'){if(CK().id==='marcus'&&marcusForm>0)marcusRoarSet();else swing(P,'set',CK())}
 else if(players===2){if(e.code==='KeyM')swing(A,A.y<GR-16?'spike':'bump',CK2());else if(e.code==='KeyN')swing(A,'set',CK2())}});
addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(invertT>0){if(k==='a')k='d';else if(k==='d')k='a';else if(k==='arrowleft')k='arrowright';else if(k==='arrowright')k='arrowleft';}keys[k]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(mode==='game'&&!paused&&!onlineOn)togglePause()});
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){if(mode==='game'&&!paused){if(onlineOn&&onl&&onl.role==='join')joinTick();else update()}acc-=1000/60}tick++;draw();requestAnimationFrame(loop)}
buildBG();show('title');syncHint();
idbGet(str=>{const s=parseSave(str);if(s&&(s.t||0)>(save.t||0)){save=s;writeAll();syncHint();if(mode==='ui'&&curScr!=='over'&&curScr!=='code')show(curScr)}else if(save.t)idbSet(JSON.stringify(save))});
requestAnimationFrame(loop);
</script>
